# Python environment for scripts/, locked to the workstation environment that produced the
# reported numbers (macOS arm64, 2026-09-30). Direct dependencies and everything they pull in
# are pinned, so the environment can be rebuilt as it was.
#
#   conda env create -f environment/python.yaml
#   conda activate il15-duet-ihc
#
# imagecodecs is needed for tifffile's LZW writes.

name: il15-duet-ihc
channels:
  - conda-forge
dependencies:
  - python=3.13.12
  - pip
  - pip:
      # direct
      - numpy==2.4.3
      - scipy==1.17.1
      - matplotlib==3.10.8
      - pillow==12.1.1
      - openpyxl==3.1.5
      - tifffile==2026.5.2
      - imagecodecs==2026.3.6
      # transitive
      - contourpy==1.3.3
      - cycler==0.12.1
      - et_xmlfile==2.0.0
      - fonttools==4.62.0
      - kiwisolver==1.5.0
      - packaging==26.0
      - pyparsing==3.3.2
      - python-dateutil==2.9.0.post0
      - six==1.17.0
